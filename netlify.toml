[build]
  publish = "."
  command = "node tests/composers.test.js && node tests/branding.test.js && node scripts/stamp-site-url.js"

[build.processing]
  skip_processing = false

# Do not rewrite reserved /.netlify/* paths (HUD, forms, functions).
# Those two HUD rules were invalid and ignored by Netlify. Turn the
# drawer off in Site configuration instead (see DOMAIN.md).

# Google Search Console HTML file verification. Keep this path at site root.
[[headers]]
  for = "/google04d4f9506cc11bf7.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://cdn.tailwindcss.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/tools/business-writer"
  to = "/tools/business-writer.html"
  status = 200

[[redirects]]
  from = "/tools/resume-helper"
  to = "/tools/resume-helper.html"
  status = 200

[[redirects]]
